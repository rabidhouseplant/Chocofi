name: 'Build Chocofi Firmware'

on: [push, pull_request, workflow_dispatch] # Triggers the build on pushes, pull requests, or manual dispatch

jobs:
  build:
    # Use the standard ZMK user config build workflow.
    # This workflow automatically discovers .conf files in the 'config/' directory
    # and builds the firmware based on the shield settings within them.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    # Pass secrets like GITHUB_TOKEN required by the underlying workflow.
    secrets: inherit
    # No 'with:' block is needed here; the workflow handles discovery.
