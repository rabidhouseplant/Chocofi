# Basic Chocofi Configuration for nice!nano v2

# --- Shield Configuration ---
# Replace 'chocofi_left' and 'chocofi_right' with the actual shield names
# if they differ for your specific revision (check ZMK docs or board provider).
# If your Chocofi uses a single shield definition for both halves (less common),
# you might just need SHIELD=chocofi.
CONFIG_ZMK_KEYBOARD_NAME="Chocofi"
CONFIG_ZMK_SHIELD_LEFT="chocofi_left"
CONFIG_ZMK_SHIELD_RIGHT="chocofi_right"

# --- Core Features ---
CONFIG_ZMK_UNICODE=y             # Enable Unicode support
CONFIG_ZMK_SLEEP=y               # Enable deep sleep for power saving
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000 # Sleep after 5 minutes (300,000 ms)

# --- Bluetooth ---
CONFIG_ZMK_BLE=y                 # Enable Bluetooth Low Energy
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y # Uncomment if you want to use passkey pairing

# --- Hold-Tap Configuration ---
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64       # Increase queue size for complex behaviors like hold-taps
CONFIG_ZMK_HOLD_TAP=y                    # Enable hold-tap behaviors
CONFIG_ZMK_HOLD_TAP_INTERRUPTIBLE=n      # Non-interruptible hold-tap recommended for home row mods
CONFIG_ZMK_TAP_PREFER_HOLD=n             # Prioritize tap action slightly
CONFIG_ZMK_HOLD_TAP_TAPPING_TERM_MS=200  # Default tapping term (can be overridden in keymap)

# --- Optional Features (Uncomment to enable) ---
# CONFIG_ZMK_RGB_UNDERGLOW=y       # Enable RGB Underglow (if your board has it)
# CONFIG_WS2812_STRIP=y            # Enable WS2812 driver (needed for RGB)
# CONFIG_ZMK_BACKLIGHT=y           # Enable single-color backlight (if applicable)
# CONFIG_ZMK_OUTPUT_BEHAVIOR_ENABLED=y # Enable output switching (USB/BLE)

# --- USB ---
CONFIG_ZMK_USB=y                 # Enable USB communication
CONFIG_ZMK_USB_BOOTLOADER=y      # Support flashing via USB cable

